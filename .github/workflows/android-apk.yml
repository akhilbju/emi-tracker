
name: Build EMI Tracker APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java for Android
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Verify project structure
      - name: Verify project structure
        run: |
          echo "Repository root:"
          pwd
          ls -la

          echo "Frontend directory:"
          ls -la emi-tracker/frontend

          test -f emi-tracker/frontend/package.json

      # 5. Install dependencies
      - name: Install dependencies
        working-directory: emi-tracker/frontend
        run: npm install

      # 6. Build React application
      - name: Build React application
        working-directory: emi-tracker/frontend
        run: npm run build

      # 7. Add Android platform
      - name: Add Android platform
        working-directory: emi-tracker/frontend
        run: npx cap add android

      # 8. Sync Capacitor
      - name: Sync Capacitor
        working-directory: emi-tracker/frontend
        run: npx cap sync android

      # 9. Build Android APK
      - name: Build debug APK
        working-directory: emi-tracker/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: emi-tracker-debug-apk
          path: emi-tracker/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
